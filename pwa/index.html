<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My PWA with WebGL</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; overflow: hidden; }
    #webgl-canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <div style="position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(255,255,255,0.8); padding: 10px; font-family: sans-serif; font-size: 0.9em; max-width: 350px;">
    <h4>Signaling & P2P Control</h4>
    <button id="connectSignalButton">Connect to Signaling Server</button>
    <p>My Client ID: <span id="myClientIdDisplay">N/A</span></p>
    <p>Signaling Status: <span id="signalingStatus">Disconnected</span></p>
    <hr>
    <button id="discoverPeersButton" disabled>Discover Peers</button>
    <div style="margin-top: 5px;">
      Available Peers:
      <ul id="peersList" style="max-height: 100px; overflow-y: auto; border: 1px solid #eee; padding: 5px; margin: 0;"></ul>
    </div>
    <hr>
    <h4>Agent Control</h4>
    <label for="taskTargetPeer">Target Peer for Task:</label>
    <select id="taskTargetPeer" style="margin-bottom: 5px;"></select><br>
    <button id="assignTaskButton" disabled>Assign Task to Selected Peer</button>
    <button id="assignTaskLocallyButton">Assign Task Locally</button>
    <hr>
    <h4>Status & Results</h4>
    <p>Local Agent (<span id="localAgentIdDisplay">N/A</span>): <span id="localAgentStatus">N/A</span></p>
    <p>P2P Connections: <span id="p2pStatusDisplay">Idle</span></p> <!-- General P2P status or specific peer status -->
    <div id="completedTasksDisplay" style="margin-top: 10px; border: 1px solid #ccc; padding: 5px; max-height: 150px; overflow-y: auto;">
      <h5>Completed Task Results:</h5>
      <ul id="completedTasksList" style="padding-left: 20px; margin:0;"></ul>
    </div>
  </div>

  <script src="../shared/agent-coordination.js"></script>
  <script src="../shared/p2p.js"></script>
  <script src="../webgl/main.js"></script>
  <script>
    // --- UI Elements ---
    const connectSignalButton = document.getElementById('connectSignalButton');
    const myClientIdDisplay = document.getElementById('myClientIdDisplay');
    const signalingStatus = document.getElementById('signalingStatus');
    const discoverPeersButton = document.getElementById('discoverPeersButton');
    const peersList = document.getElementById('peersList');
    const taskTargetPeerSelect = document.getElementById('taskTargetPeer');

    const assignTaskButton = document.getElementById('assignTaskButton'); // Re-purposed
    const assignTaskLocallyButton = document.getElementById('assignTaskLocallyButton');

    const localAgentIdDisplay = document.getElementById('localAgentIdDisplay');
    const localAgentStatus = document.getElementById('localAgentStatus'); // Re-purposed
    const p2pStatusDisplay = document.getElementById('p2pStatusDisplay');
    const completedTasksList = document.getElementById('completedTasksList'); // Re-purposed

    // --- P2P and Agent Logic (from window.p2p and global Agent/initiateTaskAssignment) ---
    // Ensure p2p.js and agent-coordination.js are loaded before this script runs.
    const p2p = window.p2p;

    // --- UI Update Functions ---
    window.updateMyClientIdDisplay = function(clientId) {
      myClientIdDisplay.textContent = clientId || 'N/A';
      localAgentIdDisplay.textContent = clientId || 'N/A';
      if (clientId) {
        signalingStatus.textContent = 'Connected';
        discoverPeersButton.disabled = false;
        // Create local agent if not already done by p2p.js
        if (!p2p.getLocalAgent() && typeof Agent !== 'undefined') {
            window.localAgent = new Agent(clientId, null); // p2p.localAgent will also be this
            console.log("Local agent explicitly created in UI script for ID: " + clientId);
        }
      } else {
        signalingStatus.textContent = 'Disconnected';
        discoverPeersButton.disabled = true;
        assignTaskButton.disabled = true;
      }
      updateAgentStatusDisplay(); // Update full status
    };

    window.updatePeersList = function(peerIds) {
      peersList.innerHTML = '';
      taskTargetPeerSelect.innerHTML = '<option value="">Select Peer</option>';
      peerIds.forEach(peerId => {
        if (peerId === p2p.getMyClientId()) return; // Don't list self

        const listItem = document.createElement('li');
        listItem.textContent = `${peerId} `;
        const connectButton = document.createElement('button');
        connectButton.textContent = 'Connect';
        connectButton.onclick = () => p2p.initiateP2PConnection(peerId);
        listItem.appendChild(connectButton);
        peersList.appendChild(listItem);

        const optionItem = document.createElement('option');
        optionItem.value = peerId;
        optionItem.textContent = peerId;
        taskTargetPeerSelect.appendChild(optionItem);
      });
      assignTaskButton.disabled = peerIds.length === 0;
    };

    window.updateP2PStatus = function(peerId, status) {
        // For now, a simple display. Could be a list of connections.
        p2pStatusDisplay.textContent = `Peer ${peerId}: ${status}`;
        if (status === 'connected') {
            // Optionally update taskTargetPeerSelect or enable assign task button
        }
    };

    window.updatePeerDisconnected = function(peerId) {
        p2pStatusDisplay.textContent = `Peer ${peerId}: Disconnected`;
        // Remove from taskTargetPeerSelect if present
        const option = taskTargetPeerSelect.querySelector(`option[value="${peerId}"]`);
        if (option) option.remove();
        // Refresh peer list from server if desired, or wait for next discoverPeers click
    };

    window.updateCompletedTasksDisplay = function(agentId, task) {
      const item = document.createElement('li');
      item.textContent = `Task ${task.id} (for ${agentId}): ${task.description} -> ${task.result}`;
      completedTasksList.appendChild(item);
    };

    // --- Event Listeners ---
    connectSignalButton.onclick = () => {
      p2p.connectSignalingServer(); // Uses default URL ws://localhost:8080
      signalingStatus.textContent = 'Connecting...';
    };

    discoverPeersButton.onclick = () => {
      p2p.discoverPeers();
    };

    assignTaskButton.onclick = () => {
      const localAg = p2p.getLocalAgent();
      const targetPeerId = taskTargetPeerSelect.value;

      if (!localAg) {
        alert('Local agent not initialized. Connect to signaling server.');
        return;
      }
      if (!targetPeerId) {
        alert('Please select a target peer from the list.');
        return;
      }
      const taskDesc = "Process data block XYZ via P2P";
      initiateTaskAssignment(localAg, targetPeerId, taskDesc);
      updateAgentStatusDisplay();
    };

    assignTaskLocallyButton.onclick = () => {
        const localAg = p2p.getLocalAgent();
        if (!localAg) {
            // Try to initialize local agent if myClientId is available
            const myId = p2p.getMyClientId();
            if (myId && typeof Agent !== 'undefined') {
                 window.localAgent = new Agent(myId, null); // p2p.localAgent will also be this
                 console.log("Local agent created on demand for local task for ID: " + myId);
                 if(p2p.setLocalAgent) p2p.setLocalAgent(window.localAgent); // if p2p.js needs explicit set
            } else {
                alert('Local agent not initialized. Connect to signaling server.');
                return;
            }
        }
        const taskDesc = "Process data block ABC locally";
        initiateTaskAssignment(p2p.getLocalAgent(), p2p.getMyClientId(), taskDesc); // Assign to self
        updateAgentStatusDisplay();
    };

    function updateAgentStatusDisplay() {
        const la = p2p.getLocalAgent();
        if (la) {
            localAgentIdDisplay.textContent = la.id; // Update local agent ID display
            let currentLocalTaskDesc = 'none';
            if (la.currentTask) {
                currentLocalTaskDesc = la.currentTask.description;
            } else if (la.status === 'waiting_for_completion') {
                const waitingTask = Object.values(la.assignedTasks).find(t => t.status === 'assigned_remote' || t.status === 'in_progress');
                if(waitingTask) currentLocalTaskDesc = `Waiting for: ${waitingTask.description}`;
            }
            localAgentStatus.textContent = `${la.status} (Task: ${currentLocalTaskDesc})`;
        } else {
            localAgentIdDisplay.textContent = p2p.getMyClientId() || 'N/A';
            localAgentStatus.textContent = "N/A (not fully initialized)";
        }

        // For simplicity, P2P status is generic. Detailed status per peer is in updateP2PStatus.
        // We can list all active connections here if needed.
        // const activeCons = p2p.getAllPeerConnections ? Object.keys(p2p.getAllPeerConnections()) : [];
        // p2pStatusDisplay.textContent = activeCons.length > 0 ? `Connected to ${activeCons.join(', ')}` : "Idle";
    }

    // Auto-connect to signaling server on page load
    // connectSignalButton.click(); // Or: p2p.connectSignalingServer();

    // Update agent statuses periodically
    setInterval(updateAgentStatusDisplay, 2000);
  </script>
</body>
</html>
